name: Windows build and unit tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Compile native tray and diagnostic executables
        shell: pwsh
        run: ./build.ps1
      - name: Validate HID parsers, provider registry, scheduler and cache
        shell: pwsh
        run: |
          & .\dist\PeripheralBatteryLite.Probe.exe --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\dist\PeripheralBatteryLite.Probe.exe --scheduler-self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\dist\PeripheralBatteryLite.Probe.exe --cache-self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $paths = & .\dist\PeripheralBatteryLite.Probe.exe --storage-paths
          if ($LASTEXITCODE -ne 0 -or $paths -notcontains 'MODE=PORTABLE') { throw 'Portable storage marker was not recognized' }
          if ($paths -notcontains ('CACHE_PATH=' + (Join-Path (Resolve-Path .\dist).Path 'battery-cache.json'))) { throw 'Portable cache path mismatch' }
      - name: Verify external plugin ABI against shared Contracts DLL
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path .\dist\Plugins -Force | Out-Null
          $compiler = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          & $compiler /nologo /target:library "/out:dist\Plugins\ExampleBatteryProvider.dll" "/r:dist\PeripheralBatteryLite.Contracts.dll" .\tests\SamplePlugin.cs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\dist\PeripheralBatteryLite.Probe.exe --plugin-self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item .\dist\Plugins -Recurse -Force
      - name: Verify open-source documentation is packaged
        shell: pwsh
        run: |
          foreach ($required in @('LICENSE','README.md','README.en.md','CONTRIBUTING.md','docs/PROTOCOL_SOURCES.md','docs/PLUGINS.md')) {
            if (!(Test-Path $required)) { throw ('Missing required documentation: ' + $required) }
          }
      - name: Upload portable Windows program
        uses: actions/upload-artifact@v4
        with:
          name: peripheral-battery-lite-windows-x64
          path: |
            dist/PeripheralBatteryLite.exe
            dist/PeripheralBatteryLite.Probe.exe
            dist/PeripheralBatteryLite.Contracts.dll
            dist/portable.flag
            LICENSE
            README.md
            README.en.md
            CONTRIBUTING.md
            SECURITY.md
            docs/PORTABLE.md
            docs/PLUGINS.md
            docs/ARCHITECTURE.md
            docs/PROTOCOL_SOURCES.md
            docs/ECOSYSTEM.md
          if-no-files-found: error
